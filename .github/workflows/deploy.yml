name: Deploy to Firebase Hosting (Live)

# Runs whenever main is updated (i.e. a PR is merged) and pushes the
# contents of public/ straight to the live Firebase Hosting site.

on:
  push:
    branches: [main]

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  checks:
    name: Sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links in public/
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ./public --fallback-extensions html './public/**/*.html'
          fail: true

  deploy:
    name: Deploy live
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: manfred-siew
          channelId: live
